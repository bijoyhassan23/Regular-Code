<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            color: white;
            font-size: 50px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        [text-slid-bottom]{
            position: relative;
            cursor: pointer;
            overflow: hidden;
            &, *{
                color: transparent !important;
            }
            &::before,
            &::after{
                content: attr(text-slid-bottom);
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                transition: transform .4s ease-in-out;
            }
            &::before{
                color: white;
            }
            &::after{
                color: rgb(9, 255, 0);
                transform: translateY(100%);
            }
            &:hover{
                &::before{
                    transform: translateY(-100%);
                }
                &::after{
                    transform: translateY(0);
                }
            }
        }
    </style>
</head>
<body>
    <div>
        <div text-slid-bottom="Hello">Hello</div>
    </div>
</body>
</html>

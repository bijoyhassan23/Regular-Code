<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GSAP SplitText Hover Effect</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script>

<style>
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

[text-slid-up]{
    color: white;
    .hover-text {
        overflow: hidden;
        .char {
            position: relative;
            .top {
                transform: translateY(0%);  
            }
            .bottom {
                position: absolute;
                left: 0;
                top: 0;
                transform: translateY(100%);
            }
        }
    }
}
</style>
</head>

<body>

<div text-slid-up=".hover-text">
    <h1 class="hover-text">HOVER ME</h1><br>
    <h1 class="hover-text">HOVER ME</h1><br>
    <h1 class="hover-text">HOVER ME</h1><br>
</div>

<script>
    gsap.registerPlugin(SplitText);
    document.querySelectorAll("[text-slid-up]").forEach(container => {
        const texts = container.querySelectorAll(container.getAttribute("text-slid-up"));
        texts.forEach(text => {
            // Use SplitText to split into characters
            const split = SplitText.create(text, { 
                type: "chars", 
                charsClass: "char++",
                onSplit: (self) => {
                    splitAnimation(self, text);
                }
            });
        });
    });

    function splitAnimation(split, text) {
        // Wrap each SplitText char with the duplicate top/bottom structure
        split.chars.forEach(charEl => {
            const letter = charEl.textContent;
            charEl.textContent = "";

            const top = document.createElement("span");
            top.className = "top";
            top.textContent = letter === " " ? "\u00A0" : letter;

            const bottom = document.createElement("span");
            bottom.className = "bottom";
            bottom.textContent = letter === " " ? "\u00A0" : letter;

            charEl.appendChild(top);
            charEl.appendChild(bottom);
        });

        text.addEventListener("mouseenter", () => {
            gsap.to(split.chars, {
                yPercent: -100,
                duration: 0.45,
                ease: "power2.out",
                stagger: 0.05
            });
        });
        text.addEventListener("mouseleave", () => {
            gsap.to(split.chars, {
                yPercent: 0,
                duration: 0.45,
                ease: "power2.out",
                stagger: 0.05
            });
        });
    }
</script>

</body>
</html>

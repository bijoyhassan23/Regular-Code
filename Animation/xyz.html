<!DOCTYPE html>
<html>
  <head>
    <title>My First Map</title>

  </head>
  <body>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBg-anFa1upD19D1_NTKOnGqvYFA4Dd3bI"></script>
    <style>
      #map { height: 400px; width: 100%; }
    </style>
    <h3>My Google Map</h3>
    <div id="map"></div>
    <script>
      function initMap() {
        const location = { lat: -34.397, lng: 150.644 }; // Adjust coordinates here
        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 8,
          center: location,
        });
        const marker = new google.maps.Marker({
          position: location,
          map: map,
        });
      }
      window.onload = initMap;
    </script>
  </body>
</html>

<div id="box" class="red"></div>
<style>
    .slide_car .swiper-wrapper .swiper-slide{
        transition: 0.3s ease;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function(){
        const targets = document.querySelectorAll(".slide_car .swiper-wrapper .swiper-slide");
        function setHeight(target) {
            console.log("Class changed on target:", target);
            let height = target.querySelector('div').clientHeight;
            targets.forEach(el => el.style.height = height + "px");
        }

        // Create observer
        const observer = new MutationObserver(function(mutationsList) {
            mutationsList.forEach(function(mutation) {
                if (mutation.type === "attributes" && mutation.attributeName === "class") {
                    const target = mutation.target;
                    if (target.classList.contains("swiper-slide-active") && !target.classList.contains("swiper-slide-duplicate-active")) {
                        setHeight(target);
                    }
                }
            });
        });

        // Start observing
        targets.forEach(target => {
            observer.observe(target, {
                attributes: true,       // watch attributes
                attributeFilter: ["class"] // only watch class changes
            });
        });
        setHeight(targets[1]);
    });
</script>
